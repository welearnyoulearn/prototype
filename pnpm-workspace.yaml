allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
onlyBuiltDependencies:
  - core-js
  - sharp
  - unrs-resolver
overrides:
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  dompurify: ^3.4.13
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  postcss: ^8.5.23
  sharp: ^0.35.0
  # 1.4.0's "workerd" export condition points `require` at dist/index.js, but
  # OpenNext's dependency copy step resolves the "default" condition when
  # deciding which files to bundle (only dist/empty.js) — the esbuild step
  # then resolves the "workerd" condition and fails to find dist/index.js.
  # 1.2.0 has one unconditional "require"/"default" export, so both steps
  # agree. Same pin estore-177 uses for the same reason.
  pg-cloudflare: 1.2.0
