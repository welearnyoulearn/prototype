name: Database Backup

on:
  schedule:
    - cron: '0 20 * * *'    # 1:30am IST daily — prod
    - cron: '0 20 * * 0'    # 1:30am IST every Sunday — dev
  workflow_dispatch:
    inputs:
      target:
        description: 'Which DB to backup'
        required: true
        default: 'both'
        type: choice
        options: [both, prod, dev]

jobs:
  backup-prod:
    name: Backup Production DB
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'prod' || github.event.inputs.target == 'both')) ||
      github.event_name == 'schedule'
    steps:
      - name: Install pg_dump and rclone
        run: |
          sudo apt-get install -y postgresql-client
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SERVICE_ACCOUNT_JSON" > /tmp/sa.json
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/sa.json
          EOF

      - name: Dump prod database
        env:
          PGHOST: ${{ secrets.PROD_PGHOST }}
          PGPORT: ${{ secrets.PROD_PGPORT }}
          PGDATABASE: ${{ secrets.PROD_PGDATABASE }}
          PGUSER: ${{ secrets.PROD_PGUSER }}
          PGPASSWORD: ${{ secrets.PROD_PGPASSWORD }}
          PGSSLMODE: require
        run: |
          FILENAME="backup-prod-$(date +%Y-%m-%d).dump"
          pg_dump --no-owner --no-acl -Fc \
            -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$PGDATABASE" \
            > /tmp/$FILENAME
          echo "Dump size: $(du -sh /tmp/$FILENAME)"
          rclone copy /tmp/$FILENAME gdrive:wlyl-backups/prod/ --log-level INFO
          echo "Uploaded to service account Drive: wlyl-backups/prod/$FILENAME"

      - name: Upload to GitHub Artifacts (30-day safety copy)
        uses: actions/upload-artifact@v4
        with:
          name: prod-backup-${{ github.run_id }}
          path: /tmp/backup-prod-*.dump
          retention-days: 30

  backup-dev:
    name: Backup Dev DB
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'dev' || github.event.inputs.target == 'both')) ||
      github.event_name == 'schedule'
    steps:
      - name: Install pg_dump and rclone
        run: |
          sudo apt-get install -y postgresql-client
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SERVICE_ACCOUNT_JSON" > /tmp/sa.json
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/sa.json
          EOF

      - name: Dump dev database
        env:
          PGHOST: ${{ secrets.DEV_PGHOST }}
          PGPORT: ${{ secrets.DEV_PGPORT }}
          PGDATABASE: ${{ secrets.DEV_PGDATABASE }}
          PGUSER: ${{ secrets.DEV_PGUSER }}
          PGPASSWORD: ${{ secrets.DEV_PGPASSWORD }}
          PGSSLMODE: require
        run: |
          FILENAME="backup-dev-$(date +%Y-%m-%d).dump"
          pg_dump --no-owner --no-acl -Fc \
            -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$PGDATABASE" \
            > /tmp/$FILENAME
          echo "Dump size: $(du -sh /tmp/$FILENAME)"
          rclone copy /tmp/$FILENAME gdrive:wlyl-backups/dev/ --log-level INFO
          echo "Uploaded to service account Drive: wlyl-backups/dev/$FILENAME"

      - name: Upload to GitHub Artifacts (14-day safety copy)
        uses: actions/upload-artifact@v4
        with:
          name: dev-backup-${{ github.run_id }}
          path: /tmp/backup-dev-*.dump
          retention-days: 14
