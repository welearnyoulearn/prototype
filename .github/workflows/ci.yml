name: CI — Build & E2E Tests

on:
  push:
    branches: [main, feat/*, fix/*, hotfix/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: test
          PGUSER: test
          PGPASSWORD: test
          JWT_SECRET: ci-test-secret-not-for-production
          APP_URL: http://localhost:3000

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wlyl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: wlyl_test
          PGUSER: postgres
          PGPASSWORD: postgres
          JWT_SECRET: ci-test-secret-not-for-production
          APP_URL: http://localhost:3000

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: 'true'
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: wlyl_test
          PGUSER: postgres
          PGPASSWORD: postgres
          JWT_SECRET: ci-test-secret-not-for-production
          SETUP_SECRET: ci-test-setup
          APP_URL: http://localhost:3000
          EMAIL_HOST: ''
          EMAIL_PORT: ''
          EMAIL_USER: ''
          EMAIL_PASS: ''
          EMAIL_FROM: ''

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
