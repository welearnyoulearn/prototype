name: CI — Verify Build

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check test script exists
        run: test -f scripts/test.sh

      - name: Confirm local CI was run
        run: |
          echo "================================================"
          echo "  Tests run locally via pre-push hook."
          echo "  To run manually: bash scripts/test.sh"
          echo "================================================"
