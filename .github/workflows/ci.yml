name: CI — Build & E2E Tests (Docker)

on:
  push:
    branches: [main, feat/*, fix/*, hotfix/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build --target builder -t wlyl-build .

      - name: Type check
        run: docker run --rm wlyl-build npx tsc --noEmit

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start app + database
        run: docker compose up -d db app
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "App is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          docker compose logs app
          exit 1

      - name: Run E2E tests
        run: docker compose --profile test run --rm e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose --profile test down -v
