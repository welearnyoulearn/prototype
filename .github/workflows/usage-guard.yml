name: Usage Guard — Stop if Free Tier Exhausted

on:
  workflow_call:

jobs:
  check:
    name: Check Minutes Usage
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check billing usage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get billing for the org or user
            const owner = context.repo.owner;

            let billing;
            try {
              billing = await github.rest.billing.getGithubActionsBillingUser({
                username: owner,
              });
            } catch {
              try {
                billing = await github.rest.billing.getGithubActionsBillingOrg({
                  org: owner,
                });
              } catch {
                core.info('Could not fetch billing — proceeding (likely free plan with no overages)');
                return;
              }
            }

            const used = billing.data.total_minutes_used || 0;
            const included = billing.data.included_minutes || 2000;
            const remaining = included - used;
            const pct = Math.round((used / included) * 100);

            core.info(`Minutes used: ${used}/${included} (${pct}%)`);
            core.info(`Remaining: ${remaining} minutes`);

            if (remaining <= 0) {
              core.setFailed(
                `FREE TIER EXHAUSTED — ${used}/${included} minutes used. ` +
                `CI is stopped to avoid charges. ` +
                `Resets on your billing cycle date.`
              );
            } else if (remaining <= 200) {
              core.warning(
                `LOW MINUTES — only ${remaining} minutes remaining (${pct}% used). ` +
                `CI will auto-stop when free tier runs out.`
              );
            }
